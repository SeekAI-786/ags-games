<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math &amp; Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1FF;--dot:rgba(31,29,43,.09);--card:#fff;--soft:#F4F6FB;--text:#1F1D2B;--muted:#5E5B72;--line:#1F1D2B;--sun:#FFC93C;--main:#2F6BFF;--math:#2F6BFF;--sci:#1E9E5A;--ok:#1E9E5A;--bad:#E23B4A;--okbg:#DDF6E8;--badbg:#FDE2E5}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{font-size:16px;height:100%}
[hidden]{display:none!important}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg) radial-gradient(var(--dot) 1.6px,transparent 2px) 0 0/22px 22px;color:var(--text);font-family:"Nunito",system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
body[data-tier="expert"]{--main:#7B4DFF;--math:#2F6BFF}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.f{font-family:"Fredoka","Trebuchet MS",sans-serif}
.screen{display:none;width:100%;max-width:1040px;margin:0 auto;padding:18px 20px 24px;flex:1}
.screen.on{display:block}
.chunky{background:var(--card);border:3.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line)}
.btn{min-height:48px;border:3.5px solid var(--line);border-radius:999px;box-shadow:4px 4px 0 var(--line);padding:.55rem 1.4rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.1rem;background:var(--card)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.primary{background:var(--main);color:#fff}.btn.sun{background:var(--sun);color:#1F1D2B}.btn.big{font-size:1.35rem;padding:.7rem 2.2rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav-button{min-height:48px;background:var(--card);border:3.5px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:.55rem 1rem;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;color:var(--text)}
.nav-button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.6rem;line-height:1.05}
h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.6rem}
.muted{color:var(--muted)}
.brand-credit{position:static;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.82rem;text-align:center;pointer-events:none}
.brand-credit img{width:28px;height:28px;object-fit:contain;border-radius:7px}.brand-credit strong{color:var(--text);font-weight:800}
/* welcome */
.wel{max-width:640px;margin:0 auto}
.brandmark{display:flex;align-items:center;gap:14px;margin:14px 0 8px}.brandmark .logo{font-size:3.2rem}
.wel .sub{margin:6px 0 18px}
.nameRow{display:flex;gap:10px;flex-wrap:wrap}.nameRow input{flex:1;min-width:200px;min-height:52px;padding:.5rem 1rem;border:3.5px solid var(--line);border-radius:14px;background:var(--card);font-size:1.15rem}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.steps3>div{padding:12px 8px;text-align:center;font-size:.85rem;line-height:1.25}.steps3 b{display:block;font-size:1.6rem}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 22px}
.age{min-height:120px;padding:16px;text-align:left;border:3.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);background:var(--okbg)}
.age+.age{background:#E7E1FF;color:#1F1D2B}.age .big{font-size:2.2rem;display:block}.age b{font-family:"Fredoka";font-size:1.5rem;display:block}.age span.s{font-size:.9rem;opacity:.8}
.age:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
/* topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.topbar .who{font-family:"Fredoka";font-size:1.1rem}.topbar .sp{flex:1}
.chip{display:inline-block;padding:2px 10px;border:2.5px solid var(--line);border-radius:999px;font-size:.78rem;font-family:"Fredoka";background:var(--sun);color:#1F1D2B}
.chip.g{background:var(--okbg);color:var(--text)}
/* board */
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:10px}.sec h2{font-size:1.4rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{position:relative;min-height:128px;padding:12px 12px 14px;text-align:center;border:3.5px solid var(--line);border-radius:18px;background:var(--card);box-shadow:5px 5px 0 var(--line);border-top:8px solid var(--tc)}
.tile .ti{font-size:2.3rem;line-height:1.1;display:block}.tile .tt{font-family:"Fredoka";font-size:1.2rem;display:block;margin:4px 0}.tile .td{font-size:.8rem;color:var(--muted);font-weight:700;display:block}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
/* brief */
.brief{max-width:560px;margin:10px auto;padding:22px;text-align:center}
.brief .bi{font-size:4rem}.brief h1{font-size:2.1rem;margin:6px 0}.brief .goal{font-size:1.2rem;margin:8px 0 14px}
.brief .acts{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.fine{font-size:.9rem;color:var(--muted)}
/* play */
.playbar{position:sticky;top:8px;z-index:8;display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:14px;background:var(--card);border:3.5px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--line)}
.playbar .pt{font-family:"Fredoka";font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:"Fredoka";font-size:1.25rem;padding:4px 12px;border:3px solid var(--line);border-radius:999px;background:var(--soft)}
.timer.low{background:var(--bad);color:#fff}
.dots{display:flex;gap:6px}.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.dots i.now{background:var(--sun)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
.q{padding:18px}
.qp{display:flex;gap:12px;align-items:flex-start;font-size:1.3rem;line-height:1.35;border-left:6px solid var(--main);padding-left:12px;margin-bottom:12px}
.qp .say{margin-left:auto;flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--soft);font-size:1.2rem}
.vis{display:block;margin:6px auto 12px;max-width:100%;width:320px;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{min-height:56px;padding:10px 14px;border:3.5px solid var(--line);border-radius:14px;background:var(--soft);box-shadow:3px 3px 0 var(--line);font-size:1.1rem;font-family:"Fredoka"}
.opt.sel{background:var(--sun);color:#1F1D2B;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.num{max-width:320px;margin:0 auto}.num .disp{min-height:60px;padding:8px 14px;text-align:right;font-family:"Fredoka";font-size:2rem;border:3.5px solid var(--line);border-radius:14px;background:var(--soft);margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{min-height:56px;border:3.5px solid var(--line);border-radius:14px;background:var(--card);font-family:"Fredoka";font-size:1.4rem;box-shadow:3px 3px 0 var(--line)}
.ord{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}.ord .opt{position:relative}
.ord .opt .bd{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;border:3px solid var(--line);font-size:.85rem;display:grid;place-items:center}
.sortrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:2px dashed var(--muted)}.sortrow .nm{flex:1;min-width:130px;font-size:1.15rem}
.sortrow .opt{min-height:48px;padding:6px 12px;font-size:1rem}
.slide{max-width:420px;margin:0 auto}.slide input[type=range]{width:100%;height:48px;accent-color:var(--main)}
.actbar{position:sticky;bottom:12px;z-index:7;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;margin-top:16px;background:color-mix(in srgb,var(--card) 94%,transparent);border:3.5px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line)}
.actbar.static{position:static}
.fb{padding:16px;margin-top:14px;border:3.5px solid var(--line);border-radius:16px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb h3{font-family:"Fredoka";font-size:1.5rem}.fb p{margin-top:4px;font-size:1.1rem}
/* report */
.rep{max-width:620px;margin:14px auto;padding:22px;text-align:center}
.rep .sc{font-family:"Fredoka";font-size:4.4rem;line-height:1;color:var(--main)}
.stars{font-size:2.4rem;letter-spacing:4px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;text-align:left;font-size:1rem}.rows div{padding:8px 10px;background:var(--soft);border:2.5px solid var(--line);border-radius:12px}
.ai{margin:14px 0;padding:14px;text-align:left;background:var(--soft);border:3.5px dashed var(--line);border-radius:16px}.ai b{font-family:"Fredoka";display:block;margin-bottom:4px}
/* overlay */
.over{position:fixed;inset:0;z-index:30;background:rgba(10,9,20,.6);display:none;align-items:center;justify-content:center;padding:16px}.over.on{display:flex}
.over .box{max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.lbrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed var(--muted);font-size:.95rem}.lbrow b{flex:1}
@media (max-width:640px){h1{font-size:2rem}.ages{grid-template-columns:1fr}.rows{grid-template-columns:1fr}.steps3{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- WELCOME -->
<section class="screen on" id="sWelcome">
  <a class="nav-button" href="index.html" id="allGames"></a>
  <div class="wel">
    <div class="brandmark"><span class="logo">🔬</span><h1 id="wTitle"></h1></div>
    <p class="sub muted" id="wSub"></p>
    <div id="wStep1">
      <label class="f" for="nameIn" id="wAsk"></label>
      <div class="nameRow" style="margin-top:8px"><input id="nameIn" maxlength="18" autocomplete="off"><button class="btn primary" id="nameNext"></button></div>
      <div class="steps3" id="steps3"></div>
      <button class="nav-button" id="lbBtn"></button>
    </div>
    <div id="wStep2" hidden>
      <h2 id="hiName"></h2><p class="muted" id="pickLevel"></p>
      <div class="ages"><button class="age" data-lv="junior"><span class="big">⭐</span><b id="ageA"></b><span class="s" id="ageAs"></span></button>
      <button class="age" data-lv="expert"><span class="big">🚀</span><b id="ageB"></b><span class="s" id="ageBs"></span></button></div>
      <button class="nav-button" id="nameBack"></button>
    </div>
  </div>
</section>

<!-- BOARD -->
<section class="screen" id="sBoard">
  <div class="topbar chunky"><button class="nav-button" id="homeBtn"></button><span class="who" id="tbName"></span><span class="chip g" id="tbLevel"></span><span class="sp"></span><button class="nav-button" id="changeAge"></button></div>
  <h1 id="bTitle"></h1><p class="muted" id="bSub"></p>
  <div class="sec"><h2 id="secMath"></h2></div><div class="tiles" id="tilesMath"></div>
  <div class="sec"><h2 id="secSci"></h2></div><div class="tiles" id="tilesSci"></div>
</section>

<!-- BRIEFING -->
<section class="screen" id="sBrief">
  <div class="brief chunky">
    <div class="bi" id="brIcon"></div><span class="chip" id="brSub"></span>
    <h1 id="brTitle"></h1><p class="goal" id="brGoal"></p>
    <div class="acts"><button class="btn" id="brRead"></button><p class="fine" id="brFine"></p><button class="btn primary big" id="goBtn"></button><button class="nav-button" id="brBack"></button></div>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="sPlay">
  <div class="playbar"><button class="nav-button" id="quitBtn"></button><span class="pt" id="pTitle"></span><div class="dots" id="dots"></div><span class="timer" id="timer"></span></div>
  <div class="q chunky" id="qBox"></div>
  <div id="fbBox"></div>
  <div class="actbar" id="actbar"><button class="btn primary big" id="checkBtn" disabled></button><button class="btn sun big" id="nextBtn" hidden></button></div>
</section>

<!-- REPORT -->
<section class="screen" id="sReport">
  <div class="rep chunky" id="repBox"></div>
</section>

<div class="over" id="lbOver" role="dialog" aria-modal="true"><div class="box chunky"><h2 id="lbTitle"></h2><div id="lb"></div><div style="text-align:center;margin-top:12px"><button class="btn" id="lbClose"></button></div></div></div>

<footer class="brand-credit"><img src="AGS%20Logo.png" alt="Align Global Solution logo"><span>Developed by <strong>Align Global Solution</strong></span></footer>
